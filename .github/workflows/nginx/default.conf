server {
    listen 80;

    location / {
        # Proxy requests to Plan's internal Jetty server
        proxy_pass http://127.0.0.1:8804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable gzip compression so sub_filter can read HTML
        proxy_set_header Accept-Encoding "";

        # Dynamically inject custom_overview.js before </body>
        sub_filter '</body>' '<script src="/custom_assets/custom_overview.js"></script></body>';
        sub_filter_once on;
    }

    # Serve custom JavaScript files from disk
    location /custom_assets/ {
        alias /usr/share/nginx/html/js/;
        types { application/javascript js; }
    }
}