
# Plan gzips responses even when Accept-Encoding is empty, and `gunzip on` only
# decompresses for clients that don't accept gzip. This internal hop receives
# requests without Accept-Encoding (from the public server below), so it always
# hands plain content back, which sub_filter can then rewrite.
server {
    listen 127.0.0.1:8806;

    location / {
        proxy_pass http://127.0.0.1:8804;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";

        gunzip on;
    }
}

server {
    listen 8805;
    server_name _;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8806;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Accept-Encoding "";
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";

        sub_filter_once off;
        sub_filter '</head>' '<script defer src="/custom_assets/custom_overview.js"></script></head>';
    }

    location /custom_assets/ {
        alias /usr/share/nginx/html/js/;
        types { application/javascript js; }
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}