
server {
    listen 8805;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Request uncompressed content from Plan
        proxy_set_header Accept-Encoding "";

        # Decompress in Nginx if Plan forces GZIP anyway
        gunzip on;

        # Inject script into <head> before React SPA initializes
        sub_filter_types *;
        sub_filter_once off;
        sub_filter '</head>' '<script src="/custom_assets/custom_overview.js"></script></head>';
    }

    location /custom_assets/ {
        alias /usr/share/nginx/html/js/;
        types { application/javascript js; }
    }
}
