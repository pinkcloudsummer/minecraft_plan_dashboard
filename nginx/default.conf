cat << 'EOF' > /opt/stacks/minecraft/data/plugins/Plan/nginx/default.conf
server {
    listen 8805;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Disable compression from upstream Plan instance
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Encoding;

        gunzip on;

        # Inject into <head> before React SPA initializes
        sub_filter_types *;
        sub_filter_once off;
        sub_filter '</head>' '<script src="/custom_assets/custom_overview.js"></script></head>';
    }

    location /custom_assets/ {
        alias /usr/share/nginx/html/js/;
        types { application/javascript js; }
    }
}
EOF