
server {
    listen 8805;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 1. Disable compression from upstream Plan
        proxy_set_header Accept-Encoding "";

        # 2. Strip conditional headers so Plan returns 200 OK instead of 304
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        gunzip on;

        # 3. Inject script tag into <head>
        sub_filter_types *;
        sub_filter_once off;
        sub_filter '</head>' '<script src="/custom_assets/custom_overview.js"></script></head>';
    }

    location /custom_assets/ {
        alias /usr/share/nginx/html/js/;
        types { application/javascript js; }
    }
}
